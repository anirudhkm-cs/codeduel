# Self-hosted Judge0 CE (https://github.com/judge0/judge0).
# Runs untrusted code inside `isolate` sandboxes, hence `privileged: true`.
# NOTE: Judge0 1.13 needs cgroup v1 on the host. See README "Running Judge0".
services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always

  db:
    image: postgres:16
    env_file: judge0.conf
    volumes:
      - judge0-db:/var/lib/postgresql/data/
    restart: always

  redis:
    image: redis:7
    command:
      [
        "bash",
        "-c",
        'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    env_file: judge0.conf
    restart: always

volumes:
  judge0-db:
