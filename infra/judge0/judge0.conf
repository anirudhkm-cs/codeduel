# Minimal Judge0 configuration. Change the passwords before deploying anywhere.
# Full list of options: https://github.com/judge0/judge0/blob/master/judge0.conf

REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=change-me-redis

POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=change-me-postgres

# Sandbox defaults (our API also sends per-problem limits)
CPU_TIME_LIMIT=2
MAX_CPU_TIME_LIMIT=10
WALL_TIME_LIMIT=5
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# Lets our API create submissions in batches
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20
