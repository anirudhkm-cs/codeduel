name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codeduel
          POSTGRES_PASSWORD: codeduel
          POSTGRES_DB: codeduel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codeduel"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://codeduel:codeduel@localhost:5432/codeduel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
